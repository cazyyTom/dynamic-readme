name: Update chat.svg

on:
  schedule:
    # Runs at 06:00 UTC every day — edit the cron to change frequency
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - build-svg.js

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build chat.svg
        run: node build-svg.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat.svg
          git diff --staged --quiet && echo "No changes" || git commit -m "chore: update chat.svg"
          git push
