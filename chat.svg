    </circle>
  </g>

  <g transform="translate(10, 178)" class="msg-4 bubble-group">
    <rect width="476" height="84" rx="18" class="bubble" />
    <text x="15" y="27">My favorite project is JudGit — it's a bot that</text>
      <text x="15" y="50">reads your pull requests so your teammates don't</text>
      <text x="15" y="73">have to.</text>
  </g>

  <g transform="translate(10, 268)" class="typing-5">
